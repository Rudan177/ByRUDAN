<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFF8F0" />
<title>五度</title>
<style>
/* ================= M3 Expressive tokens ================= */
@property --bg { syntax: "<color>"; inherits: true; initial-value: #FFF8F0; }
@property --primary { syntax: "<color>"; inherits: true; initial-value: #8A4D00; }
@property --container { syntax: "<color>"; inherits: true; initial-value: #FFDDBA; }
@property --on-container { syntax: "<color>"; inherits: true; initial-value: #4A2900; }
@property --surface { syntax: "<color>"; inherits: true; initial-value: #FFFCF8; }
@property --radius { syntax: "<length>"; inherits: true; initial-value: 36px; }
@property --t { syntax: "<number>"; inherits: true; initial-value: .5; }

:root {
  --on-surface: #1C1B16;
  --on-surface-variant: #5D584F;
  --surface: #FFFCF8;
  --track: #E5DFD6;
  --inverse-surface: #312E28;
  --inverse-on-surface: #F4EFE6;
  --ease-emph: cubic-bezier(.2, 0, 0, 1);
  --ease-decel: cubic-bezier(.05, .7, .1, 1);
  --spring: cubic-bezier(.2, 1.12, .3, 1);
  --font: "Google Sans", "Google Sans Text", "HarmonyOS Sans SC", "MiSans",
    "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}

/* ================= Tonal palettes ================= */
body[data-level="-2"] { --bg: #F3F6FF; --primary: #3D5E9E; --container: #D9E2FF; --on-container: #34456E; --surface: #FAFBFF; --radius: 44px; }
body[data-level="-1"] { --bg: #F2FAF4; --primary: #2F6B4E; --container: #C7EBD7; --on-container: #1F4C35; --surface: #F8FDF9; --radius: 40px; }
body[data-level="0"]  { --bg: #FFF8F0; --primary: #8A4D00; --container: #FFDDBA; --on-container: #4A2900; --surface: #FFFBF6; --radius: 36px; }
body[data-level="1"]  { --bg: #FFF7F4; --primary: #A4432F; --container: #FFDAD2; --on-container: #5B2317; --surface: #FFF9F7; --radius: 40px; }
body[data-level="2"]  { --bg: #FBF6FE; --primary: #7A4A9D; --container: #EBDCF8; --on-container: #4B2963; --surface: #FCF9FF; --radius: 44px; }

/* ================= Dark theme ================= */
@media (prefers-color-scheme: dark) {
  :root {
    --on-surface: #EDE7DE;
    --on-surface-variant: #B7B0A5;
    --track: #37332C;
    --inverse-surface: #EDE7DE;
    --inverse-on-surface: #2A2620;
    color-scheme: dark;
  }
  body[data-level="-2"] { --bg: #0F1420; --primary: #A9C1FF; --container: #26324F; --on-container: #D9E2FF; --surface: #131A28; }
  body[data-level="-1"] { --bg: #0E1712; --primary: #8CD6AF; --container: #1E3829; --on-container: #C9EDD9; --surface: #121C16; }
  body[data-level="0"]  { --bg: #17130E; --primary: #FFB86B; --container: #3E2D18; --on-container: #FFDCBC; --surface: #1B1610; }
  body[data-level="1"]  { --bg: #1A1210; --primary: #FF9C86; --container: #47231C; --on-container: #FFDAD2; --surface: #1E1513; }
  body[data-level="2"]  { --bg: #151020; --primary: #CBA6EA; --container: #352343; --on-container: #EBDCF8; --surface: #191322; }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: clip; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--on-surface);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition:
    --bg .55s var(--ease-emph),
    --primary .45s var(--ease-emph),
    --container .55s var(--ease-emph),
    --on-container .45s var(--ease-emph),
    --surface .55s var(--ease-emph),
    --radius .6s var(--spring);
}

/* ================= Layout ================= */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  max-width: 1600px;
  margin: 0 auto;
}
.main {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding:
    calc(24px + env(safe-area-inset-top))
    clamp(20px, 5vw, 40px)
    clamp(16px, 2.5vh, 28px);
}
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(16px, 3vh, 32px);
}
.main h1 {
  margin: 0;
  font-size: clamp(34px, 5vw, 52px);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: .06em;
  color: var(--on-surface);
  text-align: center;
}

/* ================= Artwork ================= */
.stage-wrap {
  --stage-size: min(88vw, 48dvh, 560px);
  position: relative;
  display: grid;
  place-items: center;
  animation: enter .7s var(--ease-decel) .06s both;
}
.plate {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--stage-size);
  height: var(--stage-size);
  border-radius: calc(var(--radius) + 8px);
  background: var(--container);
  transform: translate(calc(-50% + 10px), calc(-50% + 12px));
}
.art-card {
  position: relative;
  z-index: 1;
  width: var(--stage-size);
  aspect-ratio: 1 / 1;
  border-radius: var(--radius);
  background: var(--container);
  overflow: hidden;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow:
    0 1px 2px rgba(62, 48, 32, .10),
    0 6px 20px rgba(62, 48, 32, .10);
  transition:
    transform .3s var(--ease-decel),
    box-shadow .3s var(--ease-emph);
}
.art-card:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 6px;
}
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(1.02);
  transition: opacity .45s var(--ease-emph), transform .55s var(--ease-decel);
}
.slide.is-active { opacity: 1; transform: none; }
.ph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--on-container);
  transition: opacity .3s var(--ease-emph);
}
.ph svg { width: 64px; height: 64px; opacity: .28; }
.art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  opacity: 0;
  transition: opacity .3s var(--ease-emph);
  user-select: none;
  -webkit-user-drag: none;
}
.slide.loaded .art { opacity: 1; }
.slide.loaded .ph { opacity: 0; }
.state {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: var(--primary);
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s linear;
}
.fab {
  position: absolute;
  right: 18px;
  bottom: 18px;
  z-index: 5;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: var(--primary);
  color: #fff;
  pointer-events: none;
  box-shadow:
    0 1px 3px rgba(0, 0, 0, .18),
    0 3px 10px rgba(0, 0, 0, .14);
  transition: transform .3s var(--ease-decel);
}
.fab svg { width: 22px; height: 22px; fill: currentColor; margin-left: 2px; }
.ripple {
  position: absolute;
  left: var(--r-x);
  top: var(--r-y);
  width: var(--r-size);
  height: var(--r-size);
  margin-left: calc(var(--r-size) / -2);
  margin-top: calc(var(--r-size) / -2);
  border-radius: 50%;
  background: var(--primary);
  opacity: .16;
  z-index: 4;
  pointer-events: none;
}
@media (hover: hover) and (pointer: fine) {
  .art-card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 2px 4px rgba(62, 48, 32, .10),
      0 10px 28px rgba(62, 48, 32, .14);
  }
  .art-card:hover .state { opacity: .05; }
  .art-card:hover .fab { transform: scale(1.05); }
}
.art-card:active { transform: scale(.985); }
.art-card:active .state { opacity: .09; }
.art-card:active .fab { transform: scale(.96); }

@keyframes enter {
  from { opacity: 0; transform: translateY(18px) scale(.97); }
  to { opacity: 1; transform: none; }
}
/* ================= Control sheet ================= */
.sheet {
  position: relative;
  background: var(--surface);
  border-radius: 28px 28px 0 0;
  padding:
    34px
    clamp(20px, 5vw, 32px)
    calc(22px + env(safe-area-inset-bottom));
  box-shadow:
    0 -1px 2px rgba(62, 48, 32, .05),
    0 -8px 28px rgba(62, 48, 32, .06);
  animation: sheet-enter .65s var(--ease-decel) .12s both;
}
@keyframes sheet-enter {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: none; }
}
.sheet-inner {
  width: min(100%, 520px);
  margin-inline: auto;
}

.slider {
  --t: .5;
  --inset: 24px;
  position: relative;
  height: 56px;
  margin-top: 16px;
  cursor: pointer;
  touch-action: none;
  outline: none;
  border-radius: 12px;
  transition: --t .5s var(--spring);
}
.slider.dragging { transition: none; }
.slider:focus-visible { outline: none; }

.track {
  position: absolute;
  left: var(--inset);
  right: var(--inset);
  top: 50%;
  height: 16px;
  transform: translateY(-50%);
  border-radius: 8px;
  background: var(--track);
  overflow: hidden;
}
.fill {
  display: block;
  height: 100%;
  width: calc(var(--t) * 100%);
  border-radius: 8px;
  background: var(--primary);
}
.ticks {
  position: absolute;
  left: var(--inset);
  right: var(--inset);
  top: 50%;
  height: 0;
}
.tick {
  position: absolute;
  top: 0;
  left: calc(100% * var(--f));
  width: 4px;
  height: 4px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(28, 27, 22, .32);
  transition: background .2s linear;
}
.tick.reached { background: rgba(255, 255, 255, .8); }

.thumb {
  position: absolute;
  top: 50%;
  left: calc((100% - var(--inset) * 2) * var(--t) + var(--inset));
  width: 8px;
  height: 44px;
  border-radius: 99px;
  transform: translate(-50%, -50%);
  background: var(--primary);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .20),
    0 2px 6px rgba(0, 0, 0, .12);
  transition: width .28s var(--spring);
}
.slider.dragging .thumb,
.slider:focus-visible .thumb { width: 24px; }
.slider:focus-visible .thumb {
  box-shadow:
    0 0 0 2px var(--surface),
    0 0 0 4px var(--primary),
    0 1px 2px rgba(0, 0, 0, .20);
}

.value {
  position: absolute;
  left: calc((100% - var(--inset) * 2) * var(--t) + var(--inset));
  bottom: calc(100% + 10px);
  transform: translate(-50%, 4px) scale(.9);
  transform-origin: bottom center;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .16);
  transition:
    opacity .16s linear,
    transform .28s var(--ease-decel);
}
.slider.dragging .value,
.slider:focus-visible .value {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

.stops {
  --inset: 24px;
  position: relative;
  height: 20px;
  margin-top: 8px;
}
.stop {
  position: absolute;
  left: calc((100% - var(--inset) * 2) * var(--f) + var(--inset));
  top: 0;
  transform: translateX(-50%);
  font-size: 12px;
  line-height: 20px;
  color: var(--on-surface-variant);
  font-variant-numeric: tabular-nums;
  transition: color .2s linear;
}
.stop.active { color: var(--primary); font-weight: 600; }

@media (hover: hover) and (pointer: fine) {
  .slider:hover .thumb { width: 24px; }
  .slider:hover .value {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}

/* ================= Snackbar ================= */
.snackbar {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 12px);
  z-index: 30;
  max-width: calc(100% - 40px);
  padding: 14px 20px;
  border-radius: 12px;
  background: var(--inverse-surface);
  color: var(--inverse-on-surface);
  font-size: 14px;
  line-height: 1.2;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 12px);
  transition:
    opacity .2s linear,
    transform .32s var(--ease-decel);
  box-shadow:
    0 2px 4px rgba(0, 0, 0, .16),
    0 6px 16px rgba(0, 0, 0, .18);
}
.snackbar.show { opacity: 1; transform: translate(-50%, 0); }
/* ================= Ripple ================= */
.ripple { animation: ripple .6s var(--ease-decel) forwards; }
@keyframes ripple {
  from { transform: scale(.2); opacity: .18; }
  to { transform: scale(1); opacity: 0; }
}

/* ================= Adaptivity ================= */
@media (min-width: 760px) {
  .sheet {
    width: min(680px, calc(100% - 48px));
    margin: 0 auto calc(28px + env(safe-area-inset-bottom));
    border-radius: 28px;
  }
  .sheet-inner { width: 100%; }
}

@media (max-height: 620px) {
  .hero { gap: 12px; }
  .main h1 { font-size: clamp(24px, 3.6vw, 32px); }
  .stage-wrap { --stage-size: min(80vw, 42dvh, 440px); }
  .sheet { padding-top: 26px; }
}

@media (orientation: landscape) and (max-height: 560px) {
  .main { padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: 14px; }
  .main h1 { font-size: clamp(20px, 3vw, 26px); }
  .hero { gap: 8px; }
  .stage-wrap { --stage-size: min(52vw, 46dvh, 300px); }
  .sheet {
    width: 100%;
    margin-bottom: 0;
    border-radius: 28px 28px 0 0;
  }
  .sheet-inner { width: min(100%, 560px); }
}

@media (prefers-color-scheme: dark) {
  .fab { color: #1B1712; }
  .value { color: #1B1712; }
  .tick.reached { background: rgba(0, 0, 0, .45); }
  .art-card {
    box-shadow:
      0 1px 2px rgba(0, 0, 0, .5),
      0 6px 20px rgba(0, 0, 0, .42);
  }
  .sheet {
    box-shadow:
      0 -1px 2px rgba(0, 0, 0, .35),
      0 -8px 28px rgba(0, 0, 0, .4);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-delay: 0s !important;
    animation-duration: .001s !important;
    transition-duration: .001s !important;
  }
  .stage-wrap, .sheet { animation: none; }
}
</style>
</head>
<body data-level="0">
<div class="app">
  <main class="main">
    <div class="hero">

      <div class="stage-wrap">

      <div class="art-card" id="card" role="button" tabindex="0" aria-label="播放当前音频">
        <div class="slide" data-i="-2">
          <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.6" cy="9.8" r="1.5"/><path d="M4.5 17.5l4.6-4.6a2 2 0 0 1 2.8 0l3.4 3.4"/><path d="M14.4 13.2l1.6-1.6a2 2 0 0 1 2.8 0l1.2 1.2"/></svg></div>
          <img class="art" src="resources/img-2.png" alt="" draggable="false" decoding="async">

          <img class="art" src="resources/img-1.png" alt="" draggable="false" decoding="async">
        </div>

          <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.6" cy="9.8" r="1.5"/><path d="M4.5 17.5l4.6-4.6a2 2 0 0 1 2.8 0l3.4 3.4"/><path d="M14.4 13.2l1.6-1.6a2 2 0 0 1 2.8 0l1.2 1.2"/></svg></div>
          <img class="art" src="resources/img0.png" alt="" draggable="false" decoding="async">

          <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.6" cy="9.8" r="1.5"/><path d="M4.5 17.5l4.6-4.6a2 2 0 0 1 2.8 0l3.4 3.4"/><path d="M14.4 13.2l1.6-1.6a2 2 0 0 1 2.8 0l1.2 1.2"/></svg></div>
          <img class="art" src="resources/img1.png" alt="" draggable="false" decoding="async">

      </div>
      </div>
    </div>
  </main>

  <section class="sheet" aria-label="音域选择">

<script>
(function () {
  var keys = [-2, -1, 0, 1, 2];
  var themes = ['#F3F6FF', '#F2FAF4', '#FFF8F0', '#FFF7F4', '#FBF6FE'];
  var darkThemes = ['#0F1420', '#0E1712', '#17130E', '#1A1210', '#151020'];
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function themeColor() {
    return (darkQuery && darkQuery.matches ? darkThemes : themes)[level];
  }
  var meta = document.querySelector('meta[name="theme-color"]');
  var body = document.body;
  var card = document.getElementById('card');
  var slider = document.getElementById('slider');
  var valueEl = document.getElementById('value');
  var stops = Array.prototype.slice.call(document.querySelectorAll('.stop'));
  var ticks = Array.prototype.slice.call(document.querySelectorAll('.tick'));
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var snack = document.getElementById('snack');

  var level = 2;
  var rawT = 0.5;
  var dragging = false;
  var inset = 24;
  var snackTimer;
  var currentAudio = null;
  var cache = {};

  // 进入页面就把五档音频全部预取进内存，点按时不再等网络
  keys.forEach(function (n) { audioFor(n); });

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function nearest(t) { return Math.max(0, Math.min(4, Math.round(t * 4))); }

  function setT(t) { slider.style.setProperty('--t', t); }

  function apply(i, haptic) {
    level = Math.max(0, Math.min(4, i));
    var n = keys[level];
    body.dataset.level = String(n);
    if (meta) meta.setAttribute('content', themeColor());
    slider.setAttribute('aria-valuenow', String(n));
    slider.setAttribute('aria-valuetext', String(n));
    valueEl.textContent = String(n);
    stops.forEach(function (s, k) { s.classList.toggle('active', k === level); });
    ticks.forEach(function (s, k) { s.classList.toggle('reached', k <= level); });
    slides.forEach(function (s, k) { s.classList.toggle('is-active', k === level); });
    if (haptic && navigator.vibrate) navigator.vibrate(6);
    stopAudio();
  }

  function setLevel(i, haptic) {
    apply(i, haptic);
    setT(level / 4);
  }

  /* ---------- 音频 ---------- */
  function audioFor(n) {
    if (!(n in cache)) {
      var a = new Audio('resources/snd' + n + '.mp3');
      a.preload = 'auto';
      cache[n] = a;
    }
    return cache[n];
  }

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
  }

  function showSnack(msg) {
    snack.textContent = msg;
    snack.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { snack.classList.remove('show'); }, 2200);
  }

  function playSound() {
    var n = keys[level];
    var a = audioFor(n);
    if (currentAudio && currentAudio !== a) currentAudio.pause();
    try {
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) {
        p.then(function () { currentAudio = a; }).catch(function () { showSnack('音频未就绪'); });
      } else {
        currentAudio = a;
      }
    } catch (e) {
      showSnack('音频未就绪');
    }
  }

  /* ---------- 涟漪 ---------- */
  function ripple(x, y) {
    var r = card.getBoundingClientRect();
    var px = x == null ? r.width / 2 : x;
    var py = y == null ? r.height / 2 : y;
    var size = Math.hypot(Math.max(px, r.width - px), Math.max(py, r.height - py)) * 2;
    var el = document.createElement('span');
    el.className = 'ripple';
    el.style.setProperty('--r-x', px + 'px');
    el.style.setProperty('--r-y', py + 'px');
    el.style.setProperty('--r-size', size + 'px');
    card.appendChild(el);
    el.addEventListener('animationend', function () { el.remove(); });
  }

  card.addEventListener('pointerdown', function (e) {
    var r = card.getBoundingClientRect();
    ripple(e.clientX - r.left, e.clientY - r.top);
  });
  card.addEventListener('click', playSound);
  card.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      ripple();
      playSound();
    }
  });

  /* ---------- 滑块 ---------- */
  function trackT(clientX) {
    var r = slider.getBoundingClientRect();
    return clamp01((clientX - r.left - inset) / (r.width - inset * 2));
  }

  function update(clientX) {
    rawT = trackT(clientX);
    setT(rawT);
    var near = nearest(rawT);
    if (near !== level) apply(near, false);
  }

  slider.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true;
    slider.classList.add('dragging');
    slider.setPointerCapture(e.pointerId);
    inset = parseFloat(getComputedStyle(slider).getPropertyValue('--inset')) || 24;
    update(e.clientX);
    e.preventDefault();
  });
  slider.addEventListener('pointermove', function (e) {
    if (dragging) update(e.clientX);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    slider.classList.remove('dragging');
    void slider.offsetWidth;
    setLevel(nearest(rawT), true);
  }
  slider.addEventListener('pointerup', endDrag);
  slider.addEventListener('pointercancel', endDrag);

  slider.addEventListener('keydown', function (e) {
    var i = level;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') i--;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') i++;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = 4;
    else return;
    e.preventDefault();
    rawT = i / 4;
    setLevel(i, true);
  });

  /* ---------- 图片状态 ---------- */
  slides.forEach(function (s) {
    var img = s.querySelector('.art');
    function ok() { s.classList.add('loaded'); }
    img.addEventListener('load', ok);
    if (img.complete && img.naturalWidth) ok();
  });

  /* ---------- 初始化 ---------- */
  if (darkQuery) {
    var onScheme = function () {
      if (meta) meta.setAttribute('content', themeColor());
    };
    if (darkQuery.addEventListener) darkQuery.addEventListener('change', onScheme);
    else if (darkQuery.addListener) darkQuery.addListener(onScheme);
  }
  setLevel(2, false);
})();
</script>
</body>
</html>
